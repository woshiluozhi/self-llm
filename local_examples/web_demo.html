<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiniCPM WebDemo</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --surface: #ffffff;
      --surface-alt: #f0f5f2;
      --text: #1f2937;
      --muted: #64748b;
      --line: #d6dde7;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --ok: #16803c;
      --warn: #a15c07;
      --danger: #b42318;
      --user: #e8f0ff;
      --assistant: #eff7f0;
      --system: #fff7e6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
    }

    aside {
      border-right: 1px solid var(--line);
      background: var(--surface);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: 0;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 650;
      letter-spacing: 0;
      color: var(--muted);
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 14px;
      padding: 9px 10px;
      letter-spacing: 0;
    }

    input[type="range"] {
      padding: 0;
    }

    .stack {
      display: grid;
      gap: 12px;
    }

    .inline {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--warn);
    }

    .dot.ok {
      background: var(--ok);
    }

    .metric {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      border-bottom: 1px solid var(--line);
      padding: 7px 0;
    }

    .metric strong {
      color: var(--text);
      font-weight: 600;
      text-align: right;
    }

    button,
    .link-button {
      min-height: 40px;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0 14px;
      font: inherit;
      font-weight: 600;
      letter-spacing: 0;
      background: var(--primary);
      color: #ffffff;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button.secondary,
    .link-button.secondary {
      background: var(--surface);
      color: var(--text);
      border-color: var(--line);
    }

    button.danger {
      background: var(--surface);
      color: var(--danger);
      border-color: var(--line);
    }

    button:hover,
    .link-button:hover {
      background: var(--primary-hover);
      color: #ffffff;
    }

    button.secondary:hover,
    .link-button.secondary:hover,
    button.danger:hover {
      background: #edf2f7;
      color: var(--text);
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #messages {
      min-height: 0;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      width: min(780px, 92%);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: var(--surface);
    }

    .message.user {
      align-self: flex-end;
      background: var(--user);
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--assistant);
    }

    .message.system {
      align-self: center;
      width: min(720px, 92%);
      background: var(--system);
      color: #5d4507;
    }

    .message .meta {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .message .body {
      display: block;
    }

    .sources {
      margin-top: 10px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
      display: grid;
      gap: 8px;
      white-space: normal;
    }

    .source-title {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    details.source {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.65);
      padding: 8px 10px;
    }

    details.source summary {
      cursor: pointer;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
    }

    details.source p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .composer {
      border-top: 1px solid var(--line);
      background: var(--surface);
      padding: 14px 22px 18px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }

    #prompt {
      min-height: 54px;
      max-height: 180px;
      resize: vertical;
    }

    .value {
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      main {
        min-height: 70vh;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .composer {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <section>
        <h2>Runtime</h2>
        <div class="metric"><span>Status</span><strong id="status-text">Checking</strong></div>
        <div class="metric"><span>CUDA</span><strong id="cuda-text">Unknown</strong></div>
        <div class="metric"><span>Sessions</span><strong id="session-count">0</strong></div>
        <div class="metric"><span>RAG chunks</span><strong id="rag-chunks">0</strong></div>
      </section>

      <section class="stack">
        <h2>Session</h2>
        <label for="session-id">
          Session ID
          <input id="session-id" value="default" />
        </label>
        <div class="inline">
          <button id="reset" class="danger" type="button">Reset</button>
          <button id="export" class="secondary" type="button">Export</button>
        </div>
      </section>

      <section class="stack">
        <h2>Mode</h2>
        <label for="mode">
          Response mode
          <select id="mode">
            <option value="chat">Chat</option>
            <option value="rag">RAG knowledge base</option>
          </select>
        </label>
        <label for="top-k">
          RAG top-k
          <input id="top-k" type="number" min="1" max="8" step="1" value="4" />
        </label>
        <button id="rebuild-rag" class="secondary" type="button">Rebuild RAG</button>
      </section>

      <section class="stack">
        <h2>Generation</h2>
        <label for="temperature">
          Temperature <span class="value" id="temperature-value">0.5</span>
          <input id="temperature" type="range" min="0.1" max="1.5" step="0.1" value="0.5" />
        </label>
        <label for="top-p">
          Top-p <span class="value" id="top-p-value">0.8</span>
          <input id="top-p" type="range" min="0.1" max="1" step="0.05" value="0.8" />
        </label>
        <label for="max-length">
          Max length
          <input id="max-length" type="number" min="256" max="4096" step="128" value="1024" />
        </label>
      </section>

      <section class="stack">
        <h2>Links</h2>
        <a class="link-button secondary" href="/docs">Swagger</a>
        <a class="link-button secondary" href="/health">Health</a>
        <a class="link-button secondary" href="/rag/status">RAG Status</a>
      </section>
    </aside>

    <main>
      <header>
        <h1>MiniCPM WebDemo</h1>
        <span class="status"><span id="status-dot" class="dot"></span><span id="header-status">Checking</span></span>
      </header>

      <section id="messages" aria-live="polite"></section>

      <form class="composer" id="chat-form">
        <textarea id="prompt" name="prompt" placeholder="输入问题，Enter 发送，Shift+Enter 换行" rows="2"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </main>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const promptInput = document.getElementById("prompt");
    const sendButton = document.getElementById("send");
    const resetButton = document.getElementById("reset");
    const exportButton = document.getElementById("export");
    const rebuildRagButton = document.getElementById("rebuild-rag");
    const sessionInput = document.getElementById("session-id");
    const mode = document.getElementById("mode");
    const topK = document.getElementById("top-k");
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const headerStatus = document.getElementById("header-status");
    const cudaText = document.getElementById("cuda-text");
    const sessionCount = document.getElementById("session-count");
    const ragChunks = document.getElementById("rag-chunks");
    const temperature = document.getElementById("temperature");
    const topP = document.getElementById("top-p");
    const maxLength = document.getElementById("max-length");
    const temperatureValue = document.getElementById("temperature-value");
    const topPValue = document.getElementById("top-p-value");

    const state = {
      messages: [],
    };

    function currentSessionId() {
      return sessionInput.value.trim() || "default";
    }

    function renderMessages() {
      messages.replaceChildren();
      if (state.messages.length === 0) {
        addMessage("system", "Ready. Chat mode calls the model directly. RAG mode retrieves local documents first.", false);
        return;
      }
      for (const item of state.messages) {
        addMessage(item.role, item.text, false, item.sources || []);
      }
      messages.scrollTop = messages.scrollHeight;
    }

    function renderSources(item, sources = []) {
      item.querySelector(".sources")?.remove();
      if (!sources.length) return;

      const wrapper = document.createElement("div");
      wrapper.className = "sources";
      const title = document.createElement("div");
      title.className = "source-title";
      title.textContent = "Retrieved sources";
      wrapper.appendChild(title);

      for (const source of sources) {
        const detail = document.createElement("details");
        detail.className = "source";
        const summary = document.createElement("summary");
        summary.textContent = `${source.source} #${source.chunk_index} score ${source.score}`;
        const body = document.createElement("p");
        body.textContent = source.text;
        detail.append(summary, body);
        wrapper.appendChild(detail);
      }

      item.appendChild(wrapper);
    }

    function addMessage(role, text, persist = true, sources = []) {
      const item = document.createElement("div");
      item.className = `message ${role}`;
      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = role;
      const body = document.createElement("span");
      body.className = "body";
      body.textContent = text;
      item.append(meta, body);
      renderSources(item, sources);
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
      if (persist) {
        state.messages.push({ role, text, sources, time: new Date().toISOString() });
      }
      return item;
    }

    function updateParameterLabels() {
      temperatureValue.textContent = temperature.value;
      topPValue.textContent = topP.value;
    }

    async function updateHealth() {
      try {
        const res = await fetch("/health");
        const data = await res.json();
        const ready = Boolean(data.model_loaded);
        statusDot.className = ready ? "dot ok" : "dot";
        statusText.textContent = ready ? "Ready" : "Loading";
        headerStatus.textContent = ready ? "Ready" : "Loading";
        cudaText.textContent = data.cuda_available ? "Available" : "CPU";
        sessionCount.textContent = String(data.active_sessions ?? 0);
        ragChunks.textContent = String(data.rag_index?.chunks ?? 0);
      } catch {
        statusDot.className = "dot";
        statusText.textContent = "Offline";
        headerStatus.textContent = "Offline";
        cudaText.textContent = "Unknown";
        ragChunks.textContent = "0";
      }
    }

    async function sendPrompt(prompt) {
      addMessage("user", prompt);
      sendButton.disabled = true;
      const pending = addMessage("assistant", "Thinking...");
      const endpoint = mode.value === "rag" ? "/rag/query" : "/chat";

      try {
        const payload = {
          prompt,
          temperature: Number(temperature.value),
          top_p: Number(topP.value),
          max_length: Number(maxLength.value),
        };
        if (mode.value === "chat") {
          payload.session_id = currentSessionId();
        } else {
          payload.top_k = Number(topK.value);
        }

        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        const text = data.response || data.error || "No response";
        const sources = data.sources || [];
        pending.querySelector(".body").textContent = text;
        renderSources(pending, sources);
        state.messages[state.messages.length - 1].text = text;
        state.messages[state.messages.length - 1].sources = sources;
        await updateHealth();
      } catch (error) {
        const text = `Request failed: ${error}`;
        pending.querySelector(".body").textContent = text;
        state.messages[state.messages.length - 1].text = text;
      } finally {
        sendButton.disabled = false;
        promptInput.focus();
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const prompt = promptInput.value.trim();
      if (!prompt) return;
      promptInput.value = "";
      await sendPrompt(prompt);
    });

    promptInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    resetButton.addEventListener("click", async () => {
      await fetch("/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: currentSessionId() }),
      });
      state.messages = [];
      renderMessages();
      await updateHealth();
      promptInput.focus();
    });

    exportButton.addEventListener("click", async () => {
      const data = JSON.stringify({
        session_id: currentSessionId(),
        exported_at: new Date().toISOString(),
        messages: state.messages,
      }, null, 2);
      await navigator.clipboard.writeText(data);
      addMessage("system", "Conversation JSON copied to clipboard.");
    });

    rebuildRagButton.addEventListener("click", async () => {
      rebuildRagButton.disabled = true;
      addMessage("system", "Rebuilding local RAG index...");
      try {
        const res = await fetch("/rag/rebuild", { method: "POST" });
        const data = await res.json();
        ragChunks.textContent = String(data.index?.chunks ?? data.indexed_chunks ?? 0);
        addMessage("system", `RAG index ready: ${ragChunks.textContent} chunks.`);
      } catch (error) {
        addMessage("system", `RAG rebuild failed: ${error}`);
      } finally {
        rebuildRagButton.disabled = false;
      }
    });

    temperature.addEventListener("input", updateParameterLabels);
    topP.addEventListener("input", updateParameterLabels);

    updateParameterLabels();
    renderMessages();
    updateHealth();
    setInterval(updateHealth, 5000);
  </script>
</body>
</html>
